          a github.com / gitlab.com / skills.sh / clawhub / skillhub page URL, or
          a direct zip/SKILL.md URL. Bare "owner/slug" is rejected: it is both a
          ClawHub id and a GitHub repo. The fetch carries no credential.
        type: string
    type: object
  internal_handler.storageBackendRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.StorageBackendConfig'
      name:
        type: string
      provider:
        type: string
      status:
        type: string
    required:
    - name
    - provider
    type: object
  internal_handler.updateLastFAQImportResultDisplayStatusRequest:
    properties:
      display_status:
        enum:
        - open
        - close
        type: string
    required:
    - display_status
    type: object
  internal_handler.updateMemberRoleRequest:
    properties:
      role:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TenantRole'
    required:
    - role
    type: object
  internal_handler.updateMyPreferencesRequest:
    properties:
      last_active_tenant_id:
        description: |-
          LastActiveTenantID lets the SPA persist "after a fresh login,
          drop me back into this workspace" across devices. Send a positive
          workspace id to set / replace, or 0 to clear. Membership is validated
          at next login, not here. Nil = field omitted from the PATCH and
          stays untouched.
        type: integer
    type: object
  internal_handler_session.AttachmentUpload:
    properties:
      data:
        description: Base64-encoded file content
        type: string
      file_name:
        description: Original filename
        type: string
      file_size:
        description: File size in bytes
        type: integer
    type: object
  internal_handler_session.CreateKnowledgeQARequest:
    properties:
      agent_enabled:
        description: Whether agent mode is enabled for this request
        type: boolean
      agent_id:
        description: Selected custom agent ID (backend resolves shared agent and its
          workspace from share relation)
        type: string
      agent_source_tenant_id:
        description: Optional disambiguator; backend still verifies the share relation
        type: integer
      attachment_ids:
        description: Pre-uploaded session-scoped document IDs
        items:
          type: string
        type: array
      attachment_uploads:
        description: Attached files (documents, audio, etc.)
        items:
          $ref: '#/definitions/internal_handler_session.AttachmentUpload'
        type: array
      channel:
        description: 'Source channel: "web", "api", "im", etc.'
        type: string
      disable_title:
        description: Whether to disable auto title generation
        type: boolean
      images:
        description: Attached images for multimodal chat
        items:
          $ref: '#/definitions/internal_handler_session.ImageAttachment'
        type: array
      knowledge_base_ids:
        description: Selected knowledge base ID for this request
        items:
          type: string
        type: array
      knowledge_ids:
        description: Selected knowledge ID for this request
        items:
          type: string
        type: array
      mcp_service_ids:
        description: Per-request MCP services selected via @mention
        items:
          type: string
        type: array
      mentioned_items:
        description: '@mentioned knowledge bases and files'
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        description: Query text for knowledge base search
        type: string
      skill_names:
        description: Per-request Skills selected via @mention
        items:
          type: string
        type: array
      suggestion_attribution:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.SuggestionAttribution'
      summary_model_id:
        description: Optional summary model ID for this request (overrides session
          default)
        type: string
      tag_ids:
        description: '@mentioned tag IDs (display/debug; scoped via MentionedItems)'
        items:
          type: string
        type: array
      web_search_enabled:
        description: Whether web search is enabled for this request
        type: boolean
    required:
    - query
    type: object
  internal_handler_session.CreateSessionRequest:
    properties:
      description:
        description: Description for the session (optional)
        type: string
      title:
        description: Title for the session (optional)
        type: string
    type: object
  internal_handler_session.GenerateTitleRequest:
    properties:
      messages:
        description: Messages to use as context for title generation
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.Message'
        type: array
    required:
    - messages
    type: object
  internal_handler_session.ImageAttachment:
    properties:
      caption:
        description: VLM analysis result (context-aware, single call)
        type: string
      data:
        description: base64 data URI from frontend (data:image/png;base64,...)
        type: string
      url:
        description: serving URL after saving to storage
        type: string
    type: object
  internal_handler_session.MentionedItemRequest:
    properties:
      id:
        type: string
      kb_id:
        description: Parent knowledge base for file/tag mentions
        type: string
      kb_name:
        description: Display name for parent KB
        type: string
      kb_type:
        description: '"document" or "faq" (only for kb type)'
        type: string
      name:
        type: string
      service_id:
        description: Parent MCP service for MCP tool mentions
        type: string
      skill_name:
        description: Preloaded agent skill name
        type: string
      type:
        description: '"kb", "file", "tag", "mcp", "skill"'
        type: string
    type: object
  internal_handler_session.SearchKnowledgeRequest:
    properties:
      knowledge_base_id:
        description: Single knowledge base ID (for backward compatibility)
        type: string
      knowledge_base_ids:
        description: IDs of knowledge bases to search (multi-KB support)
        items:
          type: string
        type: array
      knowledge_ids:
        description: IDs of specific knowledge (files) to search
        items:
          type: string
        type: array
      mentioned_items:
        description: Optional scoped tag mentions
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        description: Query text to search for
        type: string
      tag_ids:
        description: Tag IDs for filtering within a single KB
        items:
          type: string
        type: array
    required:
    - query
    type: object
  internal_handler_session.StopSessionRequest:
    properties:
      message_id:
        type: string
    required:
    - message_id
    type: object
  internal_handler_session.batchDeleteRequest:
    properties:
      delete_all:
        type: boolean
      ids:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    name: WeKnora Github
    url: https://github.com/Tencent/WeKnora
  description: WeKnora knowledge base management system API documentation
  termsOfService: http://swagger.io/terms/
  title: WeKnora API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: Agent-based intelligent QA, supporting multi-turn conversations
        and SSE streaming responses
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: QA request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: File reference form; public returns a direct loadable link
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: QA result (SSE stream)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Agent QA
      tags:
      - QA
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: Called after the user completes OAuth authorization within a conversation;
        once the token is confirmed to exist, the paused Agent tool call is resumed
      parameters:
      - description: Pending authorization ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "409":
          description: User has not yet completed authorization
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Complete in-conversation MCP OAuth authorization
      tags:
      - MCP Services
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: User actively skips OAuth authorization, unblocking the Agent
      parameters:
      - description: Pending authorization ID
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Skip in-conversation MCP OAuth authorization
      tags:
      - MCP Services
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: The user approves or rejects a tool call (used when the agent is
        blocked waiting for approval)
      parameters:
      - description: Pending approval record ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Approval result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Pending approval record does not exist
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Resolve a pending MCP tool call approval request
      tags:
      - MCP Service
  /agents:
    get:
      consumes:
      - application/json
      description: Gets all agents in the current space (including built-in agents)
      produces:
      - application/json
      responses:
        "200":
          description: Agent list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get the agent list
      tags:
      - Agent
    post:
      consumes:
      - application/json
      description: Creates a new custom agent
      parameters:
      - description: Agent information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created agent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create an agent
      tags:
      - Agent
  /agents/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "403":
          description: Built-in agents cannot be deleted
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Agent does not exist
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete an agent
      tags:
      - Agent
    get:
      consumes:
      - application/json
      description: Gets agent details by ID
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Agent details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Agent not found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get agent details
      tags:
      - Agent
    put:
      consumes:
      - application/json
      description: Updates an agent's name, description, and configuration
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated agent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "403":
          description: Built-in agents cannot be modified
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update an agent
      tags:
      - Agent
  /agents/{id}/copy:
    post:
      consumes:
      - application/json
      description: Copies the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Copied successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Agent does not exist
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Copy an agent
      tags:
      - Agent
  /agents/{id}/shares/{share_id}:
    delete:
      description: Removes the specified share relationship from an agent's share
        list
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Share record ID
        in: path
        name: share_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true'
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Permission denied
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Cancel an agent share
      tags:
      - Organization
  /agents/{id}/suggested-questions:
    get:
      consumes:
      - application/json
      description: Returns suggested questions for the user to quickly ask, based
        on the knowledge bases associated with the agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Comma-separated list of knowledge base IDs, overrides the agent's
          default configuration
        in: query
        name: knowledge_base_ids
        type: string
      - description: Comma-separated list of knowledge IDs, restricts to specific
          documents
        in: query
        name: knowledge_ids
        type: string
      - description: Tag scopes with knowledge base ownership (JSON)
        in: query
        name: tag_scopes
        type: string
      - description: Maximum number of results (uses the agent's configured opening
          question count when omitted, max 30)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Suggested question list
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Agent does not exist
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get suggested questions
      tags:
      - Agent
  /agents/placeholders:
    get:
      consumes:
      - application/json
      description: Gets all available prompt placeholder definitions, grouped by field
        type
      produces:
      - application/json
      responses:
        "200":
          description: Placeholder definitions
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get placeholder definitions
      tags:
      - Agent
  /agents/type-presets:
    get:
      consumes:
      - application/json
      description: Returns all agent type presets available under smart-reasoning
        (RAG/Wiki/Hybrid/Custom), used by the editor to auto-fill the system prompt,
        tools, and KB compatibility
      produces:
      - application/json
      responses:
        "200":
          description: Preset list
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get the agent type preset list
      tags:
      - Agent
  /api/v1/knowledge/{id}/spans:
    get:
      consumes:
      - application/json
      description: 'Returns the trace tree (root → stage → subspan) for this knowledge
        item''s parsing pipeline: each segment''s status, duration, input/output,
        error code, and langfuse_trace_id. Supports ?attempt=N to view a historical
        attempt; if omitted, returns the latest attempt. Used by the frontend to render
        the timeline plus multimodal/embedding child nodes and a one-click jump to
        Langfuse.'
      parameters:
      - description: Knowledge ID
        in: path
        name: id
        required: true
        type: string
      - description: The attempt number to view; omit for the latest
        in: query
        name: attempt
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get the span tree of a knowledge document's parsing run (including
        historical attempts)
      tags:
      - Knowledge Management
  /auth/auto-setup:
    post:
      consumes:
      - application/json
      description: 'Lite-edition only: on first startup, automatically creates a default
        user and space and returns a token; on subsequent startups, issues a token
        directly, skipping manual register/login.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.LoginResponse'
        "403":
          description: Not the Lite edition
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      summary: Auto setup (Lite desktop edition)
      tags:
      - Auth
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the current user's login password. The new password must
        be 8-32 characters and contain both letters and digits; on success all sessions
        are revoked and re-login is required.
      parameters:
      - description: Password change request
        in: body
        name: request
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Change succeeded
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Change password
      tags:
      - Auth
  /auth/config:
    get:
      consumes:
      - application/json
      description: Returns public auth configuration such as the current deployment's
        registration mode, so the frontend can decide whether to show the registration
        entry point
      produces:
      - application/json
      responses:
        "200":
          description: Auth configuration
          schema:
            additionalProperties: true
            type: object
      summary: Get auth configuration
      tags:
      - Auth
  /auth/invitations/lookup:
    post:
      consumes:
      - application/json
      description: |-
        Given the token from an invitation link, returns the invitation context (space name / role / expiry time)
        for display on the registration page. No authentication required; returns 410 if the token is invalid or revoked.
        Uses POST + body instead of GET + path to keep the token out of access logs / browser history / tracing.
      parameters:
      - description: Invitation token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.invitationLookupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.invitationLookupResponse'
        "410":
          description: Link is invalid or has been revoked
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      summary: Resolve a shared invitation link token
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Log in and obtain an access token
      parameters:
      - description: Login request parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.LoginResponse'
        "401":
          description: Authentication failed
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the current access token and logs out
      produces:
      - application/json
      responses:
        "200":
          description: Logout succeeded
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Gets detailed information about the currently logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Get current user info
      tags:
      - Auth
  /auth/me/preferences:
    put:
      consumes:
      - application/json
      description: |-
        Merges user preferences with PATCH semantics (only fields present in the request body are overwritten; all other fields are left unchanged).
        Data is stored in users.preferences (JSON) and syncs automatically across devices/browsers.
      parameters:
      - description: Preferences patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateMyPreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated preferences
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
