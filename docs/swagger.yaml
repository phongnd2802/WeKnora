      description: |-
        Create a new space. Any logged-in user can call this to set up their own new workspace,
        and the caller is automatically made the Owner of that space. Cross-space super admins can still
        create any space through this endpoint as before.
        When tenant.auto_create_api_key (or WEKNORA_TENANT_AUTO_CREATE_API_KEY)
