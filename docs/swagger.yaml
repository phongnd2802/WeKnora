      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.GetStorageEngineStatusResponse'
      summary: Get storage engine status
      tags:
      - System
  /tenants:
    get:
      consumes:
      - application/json
      description: Get the list of spaces accessible to the current user
      produces:
      - application/json
      responses:
        "200":
          description: Space list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Get space list
