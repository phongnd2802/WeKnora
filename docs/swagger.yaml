securityDefinitions:
  ApiKeyAuth:
    description: 'API Key authentication: a space key always accesses its own space;
      a platform key calling space-scoped endpoints must also pass X-Tenant-ID'
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: 'User login authentication: enter a JWT token in the format Bearer
      {token}'
    in: header
    name: Authorization
    type: apiKey
